name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Testes unitários
        # A suíte E2E é marcada como skip automaticamente quando a stack não está no ar.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend e instalação do Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Subir stack de homologação
        run: docker compose up -d --build

      - name: Aguardar API saudável
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/api/health | grep -q '"database":"connected"'; then
              echo "API pronta"; exit 0
            fi
            sleep 2
          done
          echo "API não respondeu a tempo"; docker compose logs --tail=100 backend; exit 1

      - name: E2E de navegador
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test

      - name: Logs da API em caso de falha
        if: failure()
        run: docker compose logs --tail=200 backend

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
